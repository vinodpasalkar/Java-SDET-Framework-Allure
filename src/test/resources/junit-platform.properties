# Enables readable Cucumber output and an HTML report.
cucumber.plugin=pretty,html:target/cucumber-report.html
# Selects the feature directory.
cucumber.features=src/test/resources/features
# Selects Java glue packages.
cucumber.glue=com.nageshg.steps,com.nageshg.hooks

# Writes Cucumber execution data in Allure format for the Allure HTML report.
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
