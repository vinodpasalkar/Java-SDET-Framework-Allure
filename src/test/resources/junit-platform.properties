# Selects Java glue packages for Cucumber step definitions and hooks.
cucumber.glue=com.nageshg.steps,com.nageshg.hooks

# Cucumber plugins: console pretty printing, HTML/JSON reports, and Allure lifecycle adapter.
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm

# Runs independent Cucumber scenarios concurrently.
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
